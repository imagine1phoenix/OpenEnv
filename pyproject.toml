[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-env"
version = "0.1.0"
description = "OpenEnv email triage environment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.11.3",
  "flask==3.1.0",
  "openai==1.69.0",
  "gunicorn==22.0.0",
  "openenv-core>=0.2.0",
]

[project.scripts]
server = "server:main"
